[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa-sense-backend"
version = "0.1.0"
description = "Contract intelligence for renewable energy PPA and EPC documents"
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.80,<2",
    "langgraph>=1,<2",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.4,<6",
    "filelock>=3.10,<5",
    "numpy>=1.26,<3",
    "PyMuPDF>=1.24,<2",
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
